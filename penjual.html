<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dapur Abang Gorengan - MyGorengan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">

    <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
        <div>
            <h1 class="text-xl font-bold text-emerald-400">👨‍🍳 Dapur Abang Gorengan</h1>
            <p class="text-xs text-slate-400">Pantau pesanan masuk secara real-time</p>
        </div>
        <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-bold flex items-center gap-1">
            <i class="fa-solid fa-circle text-[8px] animate-ping"></i> Realtime Sync
        </span>
    </header>

    <div id="daftar-pesanan" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- List pesanan muncul di sini -->
    </div>

    <script>
        const SUPABASE_URL = 'https://nibxqxbvwrnvgjbncvys.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pYnhxeGJ2d3JudmdqYm5jdnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzcxMDQsImV4cCI6MjEwNjk1MzEwNH0.p0FtDSXBIOLRMzal8sg4YHpf__cjxD9V9XmAxHIRJ84';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const namaGorenganMap = {
            'qty-tahu': '🥟 Tahu Isi Crispy',
            'qty-tempe': '🟨 Tempe Mendoan',
            'qty-bakwan': '🥦 Bakwan Sayur'
        };

        async function loadPesananAwal() {
            const { data, error } = await supabaseClient
                .from('pesanan')
                .select('*')
                .order('id', { ascending: false });
    // Mengambil tanggal hari ini (Format: YYYY-MM-DD)
    const hariIni = new Date().toISOString().split('T')[0];

    const { data, error } = await supabaseClient
        .from('pesanan')
        .select('*')
        .gte('created_at', `${hariIni}T00:00:00`) // Hanya ambil pesanan mulai jam 00:00 hari ini
        .order('id', { ascending: false });

    const container = document.getElementById('daftar-pesanan');
    container.innerHTML = '';
    
    if (data && data.length > 0) {
        data.forEach(p => tambahKartuPesanan(p));
    } else {
        container.innerHTML = `<p class="text-xs text-slate-500 col-span-2 text-center py-8">Belum ada pesanan masuk hari ini.</p>`;
    }
}


            const container = document.getElementById('daftar-pesanan');
            container.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(p => tambahKartuPesanan(p));
            } else {
                container.innerHTML = `<p class="text-xs text-slate-500 col-span-2 text-center py-8">Belum ada pesanan masuk.</p>`;
            }
        }

        supabaseClient
            .channel('penjual_dapur')
            .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: 'pesanan' },
                () => {
                    new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(e => {});
                    loadPesananAwal();
                }
            )
            .subscribe();

        function tambahKartuPesanan(pesanan) {
            const container = document.getElementById('daftar-pesanan');
            const isDone = pesanan.status === 'siap_ambil';
            const isTaken = pesanan.status === 'sudah_diambil';
            const isUnpaid = pesanan.status === 'menunggu_pembayaran';

            let daftarItemsHtml = '';
            const items = pesanan.items || {};

            for (let key in items) {
                const qty = parseInt(items[key]);
                if (qty > 0) {
                    const nama = namaGorenganMap[key] || key;
                    daftarItemsHtml += `
                        <li class="flex justify-between py-1 text-xs border-b border-slate-800">
                            <span class="text-slate-200">${nama}</span>
                            <b class="text-emerald-400">x${qty}</b>
                        </li>`;
                }
            }

            const cardHtml = `
                <div id="card-${pesanan.id}" class="bg-slate-800 border-2 ${isTaken ? 'border-slate-800 opacity-40' : (isDone ? 'border-emerald-500' : (isUnpaid ? 'border-amber-500/40' : 'border-emerald-500/70'))} rounded-2xl p-4 shadow-lg space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="bg-emerald-500 text-slate-900 font-extrabold px-3 py-1 rounded-lg text-sm">#A-0${pesanan.id}</span>
                        <span class="text-xs ${isTaken ? 'text-slate-400 bg-slate-700' : (isUnpaid ? 'text-amber-400 bg-amber-500/10' : (isDone ? 'text-emerald-400 bg-emerald-500/20' : 'text-emerald-400 bg-emerald-500/10'))} px-2.5 py-1 rounded-lg font-bold">
                            ${isTaken ? '✔️ Sudah Diambil' : (isUnpaid ? '⏳ Menunggu Bayar' : (isDone ? '🔔 Ready Diambil' : '🔥 Siap Digoreng'))}
                        </span>
                    </div>

                    <div class="border-y border-slate-700 py-2 space-y-2">
                        <p class="text-xs text-emerald-400 font-semibold">Tingkat Crispy: ${pesanan.crispy_level || 'Standard'}</p>
                        
                        <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/50">
                            <p class="text-[10px] text-slate-400 font-bold mb-1.5 uppercase tracking-wider">Item Pesanan:</p>
                            <ul>
                                ${daftarItemsHtml || '<li class="text-xs text-slate-500 italic">Tidak ada rincian item</li>'}
                            </ul>
                        </div>

                        <div class="pt-1 flex justify-between items-center">
                            <span class="text-xs text-slate-400">Total Pembayaran:</span>
                            <b class="text-white text-sm">Rp ${(pesanan.total || 0).toLocaleString('id-ID')}</b>
                        </div>
                    </div>

                    <!-- Tombol Aksi Penjual -->
                    <div class="flex justify-end gap-2 pt-1">
                        ${isTaken 
                            ? `<span class="text-xs text-slate-500 font-bold"> Selesai & Diambil</span>` 
                            : (isDone 
                                ? `<button onclick="ubahStatus(${pesanan.id}, 'sudah_diambil', this)" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-black px-4 py-2 rounded-xl text-xs shadow-lg shadow-emerald-500/20">
                                    <i class="fa-solid fa-check me-1"></i> Sudah Diambil
                                   </button>`
                                : `<button onclick="ubahStatus(${pesanan.id}, 'siap_ambil', this)" ${isUnpaid ? 'disabled class="opacity-50 cursor-not-allowed bg-slate-700 text-slate-400 font-bold px-4 py-2 rounded-xl text-xs"' : 'class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-black px-4 py-2 rounded-xl text-xs"'}>
                                    ${isUnpaid ? 'Menunggu Pembayaran...' : 'Tandai Selesai Digoreng'}
                                   </button>`
                            )
                        }
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        }

        async function ubahStatus(id, statusBaru, btn) {
            btn.disabled = true;
            btn.innerText = 'Memperbarui...';

            await supabaseClient.from('pesanan').update({ status: statusBaru }).eq('id', id);
        }

        loadPesananAwal();
    </script>
</body>
</html>
