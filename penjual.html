<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGorengan - Pesanan Masuk (Penjual)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white p-4 font-sans">

    <!-- Header Penjual -->
    <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-6">
        <div>
            <h1 class="text-xl font-bold text-amber-500">👨‍🍳 Dapur Gerobak Pak Masrur</h1>
            <p class="text-xs text-gray-400">Daftar Antrean Pesanan Masuk</p>
        </div>
        <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-semibold flex items-center gap-1">
            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span> Online
        </span>
    </div>

    <!-- Daftar Pesanan -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="daftar-pesanan">
        
        <!-- Kartu Pesanan Contoh -->
        <div class="bg-gray-800 border-2 border-amber-500 rounded-2xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="bg-amber-500 text-black font-extrabold px-2.5 py-0.5 rounded-lg text-sm">
                    #A-04
                </span>
                <span class="text-xs text-gray-400">18:42 WIB</span>
            </div>
            
            <div class="border-y border-gray-700 py-3 my-2 space-y-1">
                <div class="flex justify-between text-sm">
                    <span>2x Tahu Isi Crispy</span>
                    <span class="font-bold">Rp 4.000</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span>3x Tempe Mendoan</span>
                    <span class="font-bold">Rp 6.000</span>
                </div>
                <p class="text-xs text-amber-400 mt-2">🔥 Note: Extra Crispy!</p>
            </div>

            <div class="flex justify-between items-center mt-3">
                <span class="text-xs text-gray-400">Total: <b class="text-white">Rp 10.000</b> (QRIS)</span>
                <button onclick="selesaikanPesanan(this)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
                    Selesai Digoreng Otomatis
                </button>
            </div>
        </div>

    </div>

    <script>
        function selesaikanPesanan(btn) {
            const card = btn.closest('div.bg-gray-800');
            card.classList.remove('border-amber-500');
            card.classList.add('border-emerald-500', 'opacity-60');
            btn.className = 'bg-gray-700 text-emerald-400 font-bold px-4 py-2 rounded-xl text-xs cursor-default';
            btn.innerHTML = '✓ Siap Diambil';
            btn.onclick = null;
        }
    </script>
</body>
</html>
